# fly.toml app configuration file for Smart Apartment Server
# See https://fly.io/docs/reference/configuration/ for details.

app = "smart-apartment-server"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  APP_ENV = "staging"
  DEBUG = "false"
  LOG_LEVEL = "INFO"
  LOG_JSON = "true"
  MQTT_ENABLED = "false"
  STT_PROVIDER = "mock"
  TTS_PROVIDER = "mock"
  LLM_PROVIDER = "mock"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
