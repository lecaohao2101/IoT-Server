# fly.toml app configuration file for Smart Apartment Server
# See https://fly.io/docs/reference/configuration/ for details.

app = "smart-apartment-server"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  # fly deploy --build-arg BUILD_SHA=$(git rev-parse --short HEAD)
  [build.args]
    BUILD_SHA = "unknown"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  APP_ENV = "staging"
  DEBUG = "false"
  LOG_LEVEL = "INFO"
  LOG_JSON = "true"
  MQTT_ENABLED = "true"
  MQTT_HOST = "navyqueen-54cb285b.a01.euc1.aws.hivemq.cloud"
  MQTT_PORT = "8883"
  MQTT_TLS = "true"
  MQTT_USERNAME = "IoT-Server"
  MQTT_PASSWORD = "IoT-Server"
  MQTT_BASE_TOPIC = "home"
  MQTT_QOS = "1"
  STT_PROVIDER = "mock"
  TTS_PROVIDER = "mock"
  LLM_PROVIDER = "mock"
  # Restrict once a real front-end domain exists. "*" lets any page call this API.
  CORS_ORIGINS = "*"

# Secrets are never written here -- set them with `fly secrets set`:
#   API_KEY               bắt buộc, nếu không server sẽ từ chối khởi động
#   ALLOW_ANONYMOUS       đặt "true" nếu CỐ Ý chạy demo mở, không xác thực
#   GEMINI_API_KEY        cho LLM_PROVIDER=google
#   GOOGLE_PROJECT_ID     cho STT/TTS_PROVIDER=google
#   GOOGLE_CREDENTIALS_JSON   nội dung service account, dán cả file JSON
#   REDIS_URL             thay cho bộ nhớ tiến trình, state sống qua mỗi lần deploy

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
