name: CI

# Push lên main: chạy test, rồi deploy nếu server có thay đổi.
# Pull request: chỉ chạy test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy kể cả khi thư mục server/ không đổi"
        type: boolean
        default: false

# Hai lần push liên tiếp không được deploy chồng lên nhau. Test của commit cũ
# thì huỷ được, nhưng một lần deploy đang chạy thì phải để nó xong.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check app tests tools

      - name: Pytest
        run: python -m pytest -q

      - name: Cấu hình mẫu phải hợp lệ
        # .env.example là thứ người mới clone về sẽ copy. Nếu nó không parse được
        # thì họ gặp lỗi ngay ở bước đầu tiên.
        run: |
          cp .env.example .env.ci
          python - <<'PY'
          from app.config import Settings
          settings = Settings(_env_file=".env.ci")
          assert settings.app_env == "dev", settings.app_env
          print("config OK:", settings.app_name)
          PY

  mobile:
    name: Mobile — typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # scripts/verify.ts chạy trực tiếp .ts, cần Node >= 22.6
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test logic thuần
        run: npm run verify

      - name: Bundle Android
        # Bước duy nhất duyệt toàn bộ module graph, bắt được lỗi import mà
        # tsc không thấy.
        run: npm run bundle

  deploy:
    name: Deploy lên Fly.io
    needs: [server, mobile]
    if: github.event_name == 'push' || inputs.force_deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://smart-apartment-server.fly.dev
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần lịch sử để so sánh commit trước và sau.
          fetch-depth: 0

      - name: Server có thay đổi không
        id: changes
        run: |
          if [ "${{ inputs.force_deploy }}" = "true" ]; then
            echo "reason=force_deploy" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          # Lần push đầu tiên, hoặc sau khi force-push, `before` là toàn số 0.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "reason=không đọc được commit trước, deploy cho chắc" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^server/'; then
            echo "reason=server/ thay đổi" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            # Deploy không cần thiết vẫn khởi động lại máy, và với state nằm
            # trong bộ nhớ thì toàn bộ trạng thái thiết bị sẽ mất.
            echo "reason=chỉ có thay đổi ngoài server/" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bỏ qua deploy
        if: steps.changes.outputs.changed != 'true'
        run: echo "Bỏ qua — ${{ steps.changes.outputs.reason }}"

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changes.outputs.changed == 'true'

      - name: Deploy
        if: steps.changes.outputs.changed == 'true'
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Thiếu secret FLY_API_TOKEN. Tạo bằng:"
            echo "::error::  fly tokens create deploy -x 8760h"
            echo "::error::rồi thêm vào Settings > Secrets and variables > Actions"
            exit 1
          fi
          flyctl deploy \
            --build-arg BUILD_SHA="${GITHUB_SHA::7}" \
            --wait-timeout 300

      - name: Kiểm tra bản vừa deploy
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          base=https://smart-apartment-server.fly.dev
          expected="${GITHUB_SHA::7}"

          # /healthz không bao giờ cần xác thực, nên luôn kiểm được.
          status=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -m 15 "$base/healthz")
          echo "healthz: $status"
          echo "$status" | grep -q '"ok"'

          # Xác nhận bản đang chạy đúng là commit vừa push, không phải bản cũ
          # còn sót do deploy lỗi âm thầm. /readyz công bố mã build cho cả
          # caller ẩn danh, nên bước này không cần secret nào -- một kiểm tra
          # chỉ chạy khi có credential là một kiểm tra sẽ âm thầm ngừng chạy.
          ready=$(curl -fsS -m 15 "$base/readyz" || echo '{}')
          running=$(echo "$ready" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build") or "")' 2>/dev/null || echo "")

          if [ -z "$running" ]; then
            echo "::warning::Server không báo mã build — nhiều khả năng đang chạy bản cũ hơn bản vá này."
          elif [ "$running" != "$expected" ]; then
            echo "::error::Bản đang chạy là '$running', đáng lẽ phải là '$expected'"
            exit 1
          else
            echo "Đang chạy đúng commit $running"
          fi
